# Portable desktop package and developer tools; embedded firmware builds separately.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos90gt-control"
version = "1.0.0"
description = "Celestron Cosmos 90GT / SkyQLink WiFly RN-171 Wi-Fi setup, telescope motor diagnostics and SkySafari bridge"
readme = "README.md"
keywords = ["celestron", "cosmos-90gt", "skyqlink", "wifly", "rn171", "skysafari", "skyportal", "cpwi", "telescope-control", "wifi-provisioning", "celestron-aux", "tcp-bridge"]
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8"]

[project.urls]
Repository = "https://github.com/mjklopfer/celestron-cosmos-90gt-wifi-telescope-control"
Issues = "https://github.com/mjklopfer/celestron-cosmos-90gt-wifi-telescope-control/issues"

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]
bundle = ["pyinstaller>=6,<7"]
mcp = ["mcp>=1.9,<2"]

[project.scripts]
cosmos90gt = "skyqlink_setup:main"
cosmos90gt-bridge = "bridge_mode:main"
cosmos90gt-mcp = "cosmos_mcp:main"

[tool.setuptools]
py-modules = ["skyqlink_setup", "ui_zoom", "motor_control", "bridge_mode", "network_info", "endpoint_lock", "celestron_probe", "setup_backend", "wifly_configure", "diagnostics", "time_settings", "motor_settings", "telescope_calibration", "calibrate_telescope", "cosmos_mcp", "position_control", "tracking_stream", "discover_modules", "recover_link", "verify_motors", "verify_bridge", "gui_hardware_check"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["experiments", ".venv", ".esp-venv", "hardware/esp32-connectivity", "build", "dist", "find_telescope.py", "motor_test_v02.py", "motor_pulse_v03.py", "wifly_read.py", "test_find_telescope.py", "test_motor.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM"]
ignore = ["SIM105", "SIM108", "SIM117"]
